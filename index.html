<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>萌萌 IPTV 服务中心</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    background:
    radial-gradient(circle at top,#164e63,#020617 60%);

    font-family:
    "Microsoft YaHei",
    Arial;

    color:white;

}



.container{

    max-width:900px;

    margin:auto;

    padding:40px 20px;

}




.header{

    text-align:center;

    padding:30px 0;

}



.logo{

    font-size:38px;

    font-weight:bold;

    background:
    linear-gradient(90deg,#22d3ee,#38bdf8,#a78bfa);

    -webkit-background-clip:text;

    color:transparent;

}



.sub{

    margin-top:15px;

    color:#94a3b8;

    font-size:16px;

}





.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));

    gap:20px;

}




.card{


    background:

    rgba(255,255,255,0.08);


    border:

    1px solid rgba(255,255,255,0.15);


    border-radius:20px;


    padding:25px;


    backdrop-filter:blur(15px);


    box-shadow:

    0 0 30px rgba(34,211,238,.15);


    transition:.3s;


}



.card:hover{


    transform:
    translateY(-8px);


    box-shadow:

    0 0 40px rgba(56,189,248,.4);


}



.icon{

    font-size:45px;

}



.title{

    font-size:22px;

    margin:15px 0;

}




.desc{

    color:#cbd5e1;

    line-height:1.8;

}




.btn{


    display:block;


    margin-top:20px;


    padding:14px;


    text-align:center;


    border-radius:30px;


    background:

    linear-gradient(
    90deg,
    #06b6d4,
    #6366f1
    );


    color:white;


    text-decoration:none;


    font-weight:bold;


}



.footer{

    text-align:center;

    color:#64748b;

    margin-top:50px;

}



</style>


</head>


<body>


<div class="container">



<div class="header">

</div>

</div>

</html>
